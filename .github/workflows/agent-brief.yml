name: Uretim Plani Ajani

# Her sabah 05:00 UTC = 08:00 Istanbul: gunluk uretim plani.
# (Not: Yonetim Ajaninin diger rapor tipleri 2026-09-22'de kaldirildi.)
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: uretim-plani-ajani-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    env:
      API_BASE: https://erci-materials-api.onrender.com
      API_KEY: ${{ secrets.MERCI_API_KEY }}
    steps:
      - name: Render servisini uyandir
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 60 "$API_BASE/" || true)
            echo "deneme $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "Render uyanmadi ama yine de devam ediyoruz." >&2

      - name: Gunluk uretim planini uret
        run: |
          set -e
          T=gunluk-uretim-plani
          start=$(curl -s -m 120 -X POST "$API_BASE/api/agent/run?type=$T" \
            -H "x-api-key: $API_KEY")
          echo "run yaniti: $start"
          case "$start" in
            *'"started":true'*) : ;;
            *) echo "run baslamadi: $start" >&2; exit 1 ;;
          esac
          # status.running false olana kadar bekle (max ~5 dk)
          for i in $(seq 1 60); do
            sleep 5
            st=$(curl -s -m 30 "$API_BASE/api/agent/status" -H "x-api-key: $API_KEY")
            case "$st" in
              *'"running":false'*)
                echo "bitti: $st"
                case "$st" in
                  *'"lastError":null'*) echo "OK: $T" ;;
                  *) echo "uretim hatasi: $st" >&2; exit 1 ;;
                esac
                break
                ;;
            esac
            [ "$i" = "60" ] && { echo "zaman asimi: $T" >&2; exit 1; }
          done
